<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awyne Studio · Watch movies and shows</title>
<meta name="description" content="Awyne Studio: movies and shows in one place. Tap Watch now to start streaming.">
<meta name="theme-color" content="#090909">
<meta property="og:title" content="Awyne Studio">
<meta property="og:description" content="Movies and shows in one place. Tap Watch now to start streaming.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --gold:#d8bd75;
  --gold-deep:#8e7136;
  --teal:#12c99b;
  --bg:#090909;
  --card:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.12);
  --muted:#8b8b93;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* ---------- Moving background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.b1{width:55vmax;height:55vmax;left:-18vmax;top:-20vmax;background:radial-gradient(circle,rgba(150,113,45,.55),transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;right:-20vmax;top:10vmax;background:radial-gradient(circle,rgba(104,30,30,.5),transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
.b3{width:45vmax;height:45vmax;left:10vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(18,201,155,.22),transparent 65%);animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vmax,8vmax) scale(1.1)}}
@keyframes drift3{to{transform:translate(8vmax,-10vmax) scale(1.2)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%)}

/* ---------- Layout ---------- */
.wrap{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
.card{width:min(440px,100%);text-align:center;padding:34px 22px 26px;border-radius:28px;
  background:var(--card);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}

.rise{opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- Logo ---------- */
.logo{position:relative;width:104px;height:104px;margin:0 auto 18px;border-radius:28px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#241d0f,#0c0b08);
  border:1px solid rgba(216,189,117,.45);
  box-shadow:0 0 0 6px rgba(216,189,117,.06),0 16px 40px rgba(0,0,0,.6),0 0 50px rgba(216,189,117,.18)}
.logo::after{content:"";position:absolute;inset:-10px;border-radius:34px;border:1px solid rgba(216,189,117,.25);animation:ring 3.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.logo img{width:66px;height:66px;object-fit:contain;display:block}

.brand{display:flex;align-items:baseline;justify-content:center;gap:10px}
.brand b{font-size:34px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(160deg,#fff 5%,#e6e1d2 35%,var(--gold) 70%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:11px;letter-spacing:4px;color:var(--muted)}
.tag{margin:10px auto 0;max-width:300px;color:#b9b9c1;font-size:15px;line-height:1.5}

.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 24px}
.chip{font-size:12px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#d4d4da}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;box-shadow:0 0 10px var(--teal);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Main button ---------- */
.watch{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:18px 20px;border-radius:18px;border:0;cursor:pointer;text-decoration:none;overflow:hidden;
  background:linear-gradient(135deg,#f1dca0,var(--gold) 45%,#b08d3e);
  color:#1a1405;font-size:18px;font-weight:800;letter-spacing:.3px;
  box-shadow:0 14px 34px rgba(216,189,117,.28);transition:transform .2s ease,box-shadow .2s ease}
.watch svg{width:20px;height:20px;flex:none}
.watch::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.watch:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(216,189,117,.38)}
.watch:active{transform:scale(.98)}
.host{margin-top:10px;font-size:12px;color:var(--muted);letter-spacing:.5px}

/* ---------- Channel links ---------- */
.sec{margin:28px 0 12px;font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.links{display:grid;gap:10px}
.link{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px;text-align:left;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.05);border:1px solid var(--line);transition:transform .2s ease,border-color .2s ease,background .2s ease}
a.link:hover{transform:translateY(-2px);border-color:rgba(216,189,117,.55);background:rgba(216,189,117,.07)}
.link .ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(216,189,117,.12);color:var(--gold)}
.link .ic svg{width:21px;height:21px}
.link .t{flex:1;min-width:0}
.link .t b{display:block;font-size:15px}
.link .t small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .go{color:var(--muted);flex:none}
.link.soon{opacity:.5;cursor:default}
.soon-pill{font-size:10px;letter-spacing:1.5px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}

.foot{margin-top:26px;font-size:12px;color:#6c6c74}
.redir{display:none;margin-top:14px;font-size:13px;color:#cfcfd6}
.redir button{margin-left:8px;background:none;border:1px solid var(--line);color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:12px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rise{opacity:1;transform:none}
}
</style>
</head>

<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <section class="card">

    <div class="logo rise" style="animation-delay:.05s"><img src="logo.png" alt="Awyne Studio logo"></div>

    <div class="brand rise" style="animation-delay:.15s"><b id="name">AWYNE</b><span>STUDIO</span></div>
    <p class="tag rise" style="animation-delay:.22s" id="tagline"></p>

    <div class="chips rise" style="animation-delay:.3s">
      <span class="chip"><i></i>Streaming now</span>
      <span class="chip">Free</span>
      <span class="chip">No sign-up</span>
    </div>

    <div class="rise" style="animation-delay:.38s">
      <a class="watch" id="watch" href="#" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
        <span id="watchText">Watch now</span>
      </a>
      <div class="host" id="host"></div>
      <div class="redir" id="redir"><span id="redirText"></span><button type="button" id="redirCancel">Cancel</button></div>
    </div>

    <div class="rise" style="animation-delay:.46s">
      <div class="sec">Channels</div>
      <div class="links" id="links"></div>
    </div>

    <p class="foot rise" style="animation-delay:.54s">© <span id="year"></span> Awyne Studio</p>
  </section>
</main>

<script>
/* =====================================================
   EDIT THIS PART ONLY
   ===================================================== */
const CONFIG = {
  // Your movie site. If you ever change the domain, change it here and re-deploy.
  SITE_URL: "https://awyne.nastu.net",

  TAGLINE: "Movies and shows in one place. Tap below to start watching.",
  BUTTON_TEXT: "Watch now",

  // 0 = stay on this page. Set to 3 to send visitors to the movie site automatically after 3 seconds.
  AUTO_REDIRECT_SECONDS: 0,

  // Add your channels here later. Remove "soon: true" and put a real "url" to make one live.
  // icon can be: "send" (Telegram style), "chat" (WhatsApp style), "camera" (Instagram style),
  //              "play" (YouTube style), "music" (TikTok style), "link"
  LINKS: [
    { title: "WhatsApp channel", note: "Updates and new releases", icon: "chat",   url: "", soon: true },
    { title: "Telegram",         note: "Join the community",       icon: "send",   url: "", soon: true },
    { title: "Instagram",        note: "Behind the scenes",        icon: "camera", url: "", soon: true }
  ]
};
/* ===================================================== */

const ICONS = {
  send:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg>',
  chat:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.7-5.2A8.5 8.5 0 1 1 21 12z"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/></svg>',
  play:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  link:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
const ARROW = '<svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>';

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Add ?ref=bio so your admin panel can tell these visits came from here.
function siteLink() {
  try {
    const u = new URL(CONFIG.SITE_URL);
    u.searchParams.set("ref", "bio");
    return u.toString();
  } catch (e) { return CONFIG.SITE_URL; }
}

const watch = document.getElementById("watch");
watch.href = siteLink();
document.getElementById("watchText").textContent = CONFIG.BUTTON_TEXT;
document.getElementById("tagline").textContent = CONFIG.TAGLINE;
document.getElementById("year").textContent = new Date().getFullYear();
try { document.getElementById("host").textContent = new URL(CONFIG.SITE_URL).host; } catch (e) {}

// Channels
const links = document.getElementById("links");
links.innerHTML = CONFIG.LINKS.map(l => {
  const live = l.url && !l.soon;
  const inner =
    '<span class="ic">' + (ICONS[l.icon] || ICONS.link) + '</span>' +
    '<span class="t"><b>' + esc(l.title) + '</b><small>' + esc(l.note || "") + '</small></span>' +
    (live ? ARROW : '<span class="soon-pill">Soon</span>');
  return live
    ? '<a class="link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + inner + '</a>'
    : '<div class="link soon" aria-disabled="true">' + inner + '</div>';
}).join("");
if (!CONFIG.LINKS.length) document.querySelector(".sec").style.display = "none";

// Optional automatic bridge to the movie site
if (CONFIG.AUTO_REDIRECT_SECONDS > 0) {
  let left = CONFIG.AUTO_REDIRECT_SECONDS;
  const box = document.getElementById("redir");
  const text = document.getElementById("redirText");
  box.style.display = "block";
  const show = () => { text.textContent = "Taking you to the movie site in " + left + "…"; };
  show();
  const timer = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(timer); location.href = siteLink(); } else show();
  }, 1000);
  document.getElementById("redirCancel").onclick = () => { clearInterval(timer); box.style.display = "none"; };
}
</script>
</body>
</html>
